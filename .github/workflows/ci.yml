name: CatalogForge CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: DATABASE_URL=sqlite:///./ci-migration.db alembic upgrade head
      - run: PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q
      - run: ruff check app tests
      - run: mypy app
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e './backend[dev]'
        working-directory: .
      - name: Start seeded API for browser tests
        run: |
          cd ..
          export DATABASE_URL=sqlite:///./ci-e2e.db
          export JWT_SECRET=ci-e2e-secret-change-me-with-more-than-32-characters
          cd backend
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../ci-e2e-api.log 2>&1 &
          sleep 5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm install --global npm@10.9.2
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
